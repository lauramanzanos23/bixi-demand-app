    /* ── header bar ── */
    #header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      padding: 14px 20px 10px;
      background: linear-gradient(180deg, rgba(15,25,35,0.95) 70%, transparent);

    }
    #header p {

    }

    /* ── legend ── */
    #legend {
      position: absolute; bottom: 28px; left: 18px; z-index: 10;
      background: rgba(15,25,35,0.82);
      border: 1px solid #1c2b3a;
      border-radius: 10px;
      padding: 12px 16px;
      backdrop-filter: blur(6px);
    }
    #legend h3 {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: #6b8299; margin-bottom: 9px;
    }
    .legend-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #c9d4e0; margin-bottom: 6px;
    }
    .legend-row:last-child { margin-bottom: 0; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0;
    }

    /* ── tooltip ── */
    #tooltip {
      position: absolute; z-index: 20; pointer-events: none;
      background: rgba(15,25,35,0.92);
      border: 1px solid #2a3f55;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 12px; color: #e8edf3;
      line-height: 1.6;
      max-width: 220px;
      display: none;
    }
    #tooltip .station-name { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
    #tooltip .cluster-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      padding: 1px 7px; border-radius: 999px; margin-bottom: 4px;
    }
    .badge-low    { background: rgba(0,120,255,0.25);  color: #4a9eff; }
    .badge-medium { background: rgba(255,215,0,0.25);  color: #f5c542; }
    .badge-high   { background: rgba(255,80,80,0.25);  color: #ff6b6b; }

    /* ── stats bar ── */
    #stats {
      position: absolute; bottom: 28px; right: 18px; z-index: 10;
      background: rgba(15,25,35,0.82);
      border: 1px solid #1c2b3a;
      border-radius: 10px;
      padding: 12px 16px;
      backdrop-filter: blur(6px);
      display: flex; gap: 20px;
    }
    .stat { text-align: center; }
    .stat-val { font-size: 20px; font-weight: 700; color: #e8edf3; }
    .stat-lbl { font-size: 10px; color: #6b8299; text-transform: uppercase; letter-spacing: 0.8px; }

</head>

const tooltip = document.getElementById('tooltip');

function showTooltip(x, y, obj) {
  const badgeClass = 'badge-' + obj.cluster_label;
  tooltip.innerHTML = `
    <div class="station-name">${obj.station}</div>
    <div class="cluster-badge ${badgeClass}">${obj.cluster_label}</div><br/>
    <span style="color:#6b8299">Avg demand</span>&nbsp; <b>${obj.mean_demand.toFixed(1)} trips/hr</b>
  `;
  tooltip.style.display = 'block';
  tooltip.style.left = (x + 14) + 'px';
  tooltip.style.top  = (y - 10) + 'px';
}

function hideTooltip() {
  tooltip.style.display = 'none';
}

const deckgl = new deck.DeckGL({
  container: 'map',
  mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  initialViewState: {
    latitude:  45.516,
    longitude: -73.573,
    zoom: 11.4,
    pitch: 45,
    bearing: 0,
  },
  controller: true,
  layers: [
    new deck.HeatmapLayer({
      id: 'heatmap',
      data: DATA,
      getPosition: d => [d.lon, d.lat],
      getWeight:   d => d.mean_demand,
      radiusPixels: 60,
      intensity: 1,
      threshold: 0.05,
      opacity: 0.55,
    }),
    new deck.ScatterplotLayer({
      id: 'scatter',
      data: DATA,
      getPosition:   d => [d.lon, d.lat],
      getRadius:     40,
      getFillColor:  d => [...d.color, 210],
      getLineColor:  [255, 255, 255, 80],
      lineWidthMinPixels: 0.5,
      radiusMinPixels: 4,
      radiusMaxPixels: 18,
      pickable: true,
      onHover: ({object, x, y}) => {
        if (object) showTooltip(x, y, object);
        else hideTooltip();
      },
    }),
  ],
});
